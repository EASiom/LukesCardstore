<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="page.calendarTitle">Kalender — Luke's Cardshop</title>
  <link rel="stylesheet" href="style.css" />
  <script src="language.js" defer></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo" aria-label="Home" data-i18n-aria="common.home">LUKE'S <span>CARDSHOP</span></a>
    <nav>
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="index.html#shop" data-i18n="nav.shop">Shop</a></li>
        <li><a href="bestellen.html" class="nav-cta" data-i18n="nav.order">Bestellen & Ankauf</a></li>
        <li><a href="kalender.html" data-i18n="nav.calendar">Kalender</a></li>
        <li><a href="anfahrt.html" class="highlight" data-i18n="nav.directions">Anfahrt</a></li>
        <li><a href="impressum.html" data-i18n="nav.imprint">Impressum</a></li>
      </ul>
    </nav>
  </header>

  <main class="calendar-page">
    <section class="calendar-shell">
      <div class="calendar-topbar">
        <div>
          <p class="eyebrow" data-i18n="calendar.eyebrow">Besondere Termine</p>
          <h1 data-i18n="calendar.title">Kalender</h1>
        </div>
        <div class="calendar-actions">
          <button id="prevMonth" type="button" class="calendar-button" aria-label="Vorheriger Monat" data-i18n-aria="calendar.previousMonth">‹</button>
          <h2 id="monthLabel">Monat</h2>
          <button id="nextMonth" type="button" class="calendar-button" aria-label="Nächster Monat" data-i18n-aria="calendar.nextMonth">›</button>
        </div>
      </div>

      <div class="calendar-layout">
        <div class="calendar-panel">
          <div class="weekday-row">
            <span data-i18n="calendar.mon">Mo</span>
            <span data-i18n="calendar.tue">Di</span>
            <span data-i18n="calendar.wed">Mi</span>
            <span data-i18n="calendar.thu">Do</span>
            <span data-i18n="calendar.fri">Fr</span>
            <span data-i18n="calendar.sat">Sa</span>
            <span data-i18n="calendar.sun">So</span>
          </div>
          <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
        </div>

        <aside class="event-panel">
          <h3 data-i18n="calendar.events">Events</h3>
          <ul id="eventList" class="event-list"></ul>
        </aside>
      </div>
    </section>

    <div id="eventDetailModal" class="event-detail-modal" hidden>
      <div class="event-detail-backdrop" data-close="true"></div>
      <div class="event-detail-content" role="dialog" aria-modal="true" aria-labelledby="eventDetailTitle">
        <button id="eventDetailClose" class="event-detail-close" type="button" aria-label="Schließen" data-i18n-aria="common.close">✕</button>
        <h3 id="eventDetailTitle" data-i18n="calendar.event">Event</h3>
        <div id="eventDetailBody"></div>
      </div>
    </div>
  </main>

  <footer>
    <p data-i18n="footer.copyright">&copy; 2024 Luke's Cardshop. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    const calendarDataScript = document.createElement('script');
    calendarDataScript.src = `calendar-data.js?v=${Date.now()}`;
    calendarDataScript.onload = () => {
      const calendarScript = document.createElement('script');
      calendarScript.src = `calendar.js?v=${Date.now()}`;
      calendarScript.onerror = () => {
        document.getElementById('eventList').innerHTML =
          `<li class="event-empty">${window.t('calendar.loadError')}</li>`;
      };
      document.body.appendChild(calendarScript);
    };
    calendarDataScript.onerror = () => {
      document.getElementById('monthLabel').textContent = window.t('calendar.dataUnavailable');
      document.getElementById('eventList').innerHTML =
        `<li class="event-empty">${window.t('calendar.dataError')}</li>`;
    };
    document.body.appendChild(calendarDataScript);
  </script>
</body>
</html>
